<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus AI | Multi-Agent Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            nexus: '#646cff',
            surface: '#0a0a0a',
            panel: '#111111'
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbar for dark mode */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #444; }
    
    .agent-card.active { border-color: currentColor; background-color: rgba(255,255,255,0.03); }
    .loader { border-top-color: #646cff; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-surface text-gray-100 font-sans min-h-screen selection:bg-nexus/30">

  <!-- Navigation -->
  <nav class="border-b border-white/5 px-6 py-4 flex justify-between items-center backdrop-blur-md sticky top-0 z-50 bg-surface/80">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-nexus to-purple-600 flex items-center justify-center font-bold text-sm">N</div>
      <span class="text-xl font-bold tracking-tight">Nexus<span class="text-nexus">AI</span></span>
    </div>
    <div class="flex items-center gap-4">
      <button id="theme-toggle" class="p-2 rounded-md hover:bg-white/5 text-gray-400 transition">🌙</button>
      <button id="auth-btn" class="px-4 py-2 bg-white text-black rounded-md text-sm font-semibold hover:bg-gray-200 transition">Sign In</button>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto p-6 grid lg:grid-cols-12 gap-8">
    
    <!-- Left Panel: Controls -->
    <div class="lg:col-span-4 space-y-6">
      
      <!-- BYOK Input -->
      <section class="p-5 rounded-xl border border-white/5 bg-white/[0.02]">
        <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2 font-semibold">API Key (BYOK)</label>
        <input 
          type="password" 
          id="api-key" 
          placeholder="sk-or-v1-... or sk-..." 
          class="w-full bg-black/50 border border-white/10 rounded-lg px-3 py-2 text-sm focus:border-nexus focus:outline-none transition placeholder-gray-700"
        />
        <p class="text-[10px] text-gray-600 mt-2">Stored locally in browser memory. Never sent to Nexus servers.</p>
      </section>

      <!-- Agent Selector -->
      <section>
        <h3 class="text-sm font-semibold text-gray-400 mb-3">Active Departments</h3>
        <div class="grid grid-cols-2 gap-2" id="agent-grid">
          <!-- Agents injected via JS -->
        </div>
      </section>

      <!-- Prompt Area -->
      <section class="space-y-3">
        <textarea 
          id="prompt-input" 
          placeholder="Describe your project... e.g., 'Build a SaaS landing page for an AI email assistant with pricing table.'" 
          rows="6" 
          class="w-full bg-panel border border-white/10 rounded-xl p-4 text-sm resize-none focus:border-nexus focus:ring-1 focus:ring-nexus outline-none transition placeholder-gray-700"
        ></textarea>
        <button 
          id="generate-btn" 
          class="w-full py-3 bg-nexus hover:bg-[#535bf2] disabled:opacity-50 disabled:cursor-not-allowed rounded-xl font-semibold text-sm transition-all shadow-lg shadow-nexus/20 flex items-center justify-center gap-2"
        >
          <span>Start Generation</span>
        </button>
      </section>
    </div>

    <!-- Right Panel: Output -->
    <div class="lg:col-span-8 min-h-[600px]" id="output-panel">
      <div class="h-full flex flex-col items-center justify-center text-gray-700 border border-dashed border-white/10 rounded-2xl p-12">
        <div class="text-6xl mb-4 opacity-20">🏗️</div>
        <p class="text-lg font-medium">Ready to build something amazing?</p>
        <p class="text-sm opacity-60">Enter your API key and describe your vision.</p>
      </div>
    </div>

  </main>

  <script>
    // --- Configuration & State ---
    const WORKER_URL = 'http://localhost:8787'; // Change to your deployed worker URL
    const AGENTS = [
      { id: 'ceo', label: 'CEO', icon: '👔', color: 'text-purple-400', border: 'border-purple-500' },
      { id: 'engineering', label: 'Engineering', icon: '💻', color: 'text-blue-400', border: 'border-blue-500' },
      { id: 'design', label: 'Design', icon: '🎨', color: 'text-pink-400', border: 'border-pink-500' },
      { id: 'marketing', label: 'Marketing', icon: '📣', color: 'text-green-400', border: 'border-green-500' },
      { id: 'finance', label: 'Finance', icon: '💰', color: 'text-yellow-400', border: 'border-yellow-500' },
      { id: 'operations', label: 'Operations', icon: '⚙️', color: 'text-orange-400', border: 'border-orange-500' },
      { id: 'video', label: 'Video Studio', icon: '🎬', color: 'text-red-400', border: 'border-red-500' },
    ];

    let selectedAgents = new Set(['ceo', 'engineering']);
    let isGenerating = false;

    // --- DOM Elements ---
    const agentGrid = document.getElementById('agent-grid');
    const outputPanel = document.getElementById('output-panel');
    const generateBtn = document.getElementById('generate-btn');
    const apiKeyInput = document.getElementById('api-key');
    const promptInput = document.getElementById('prompt-input');
    const themeToggle = document.getElementById('theme-toggle');

    // --- Initialization ---
    function init() {
      // Load saved key
      const savedKey = localStorage.getItem('nexus_byok_key');
      if (savedKey) apiKeyInput.value = savedKey;

      // Render agents
      renderAgents();

      // Theme handling
      const isDark = localStorage.getItem('nexus-theme') !== 'light';
      updateTheme(isDark);
    }

    function renderAgents() {
      agentGrid.innerHTML = AGENTS.map(agent => {
        const isActive = selectedAgents.has(agent.id);
        return `
          <button 
            onclick="toggleAgent('${agent.id}')"
            class="agent-card p-3 rounded-lg border transition-all duration-300 flex items-center gap-2 text-left
              ${isActive ? `${agent.color} ${agent.border} active` : 'border-white/5 bg-transparent text-gray-600 opacity-50 hover:opacity-80'}"
          >
            <span class="text-lg">${agent.icon}</span>
            <span class="text-xs font-medium">${agent.label}</span>
          </button>
        `;
      }).join('');
    }

    // --- Core Logic ---
    window.toggleAgent = (id) => {
      if (isGenerating) return;
      if (selectedAgents.has(id)) selectedAgents.delete(id);
      else selectedAgents.add(id);
      renderAgents();
    };

    function updateTheme(isDark) {
      document.documentElement.classList.toggle('dark', isDark);
      themeToggle.textContent = isDark ? '🌙' : '☀️';
      localStorage.setItem('nexus-theme', isDark ? 'dark' : 'light');
    }

    themeToggle.onclick = () => {
      const isDark = !document.documentElement.classList.contains('dark');
      updateTheme(isDark);
    };

    apiKeyInput.onchange = (e) => localStorage.setItem('nexus_byok_key', e.target.value);

    generateBtn.onclick = async () => {
      const apiKey = apiKeyInput.value.trim();
      const prompt = promptInput.value.trim();

      if (!apiKey || !prompt || selectedAgents.size === 0) {
        alert('Please provide an API key, prompt, and select at least one agent.');
        return;
      }

      isGenerating = true;
      generateBtn.disabled = true;
      generateBtn.innerHTML = '<div class="loader w-4 h-4 border-2 border-white/30 rounded-full"></div> Orchestrating...';
      
      // Show loading state in output
      outputPanel.innerHTML = `
        <div class="flex flex-col items-center justify-center h-full gap-4 animate-pulse">
          <div class="loader w-8 h-8 border-4 border-nexus/30 rounded-full"></div>
          <p class="text-nexus font-medium">CEO is analyzing request...</p>
        </div>
      `;

      try {
        // Simulate CEO planning then parallel execution
        // In a real app, this calls your Worker which handles the multi-step AI logic
        const results = await simulateOrchestration(prompt, apiKey);
        renderResults(results);
      } catch (err) {
        outputPanel.innerHTML = `<div class="p-8 text-red-400 bg-red-500/10 rounded-xl border border-red-500/20">Error: ${err.message}</div>`;
      } finally {
        isGenerating = false;
        generateBtn.disabled = false;
        generateBtn.innerHTML = '<span>Start Generation</span>';
      }
    };

    // --- Mock Orchestration (Replace with actual Worker fetch in production) ---
    async function simulateOrchestration(prompt, apiKey) {
      // This simulates the delay and structure of a real multi-agent response
      await new Promise(r => setTimeout(r, 1500));
      
      const results = {};
      for (const agentId of selectedAgents) {
        if (agentId === 'ceo') continue; // CEO plans, doesn't produce final artifact in this view
        results[agentId] = `[${agentId.toUpperCase()} OUTPUT]\n\nGenerated response for: "${prompt}"\n\n(This is a demo placeholder. Connect the Cloudflare Worker endpoint in the script tag to see real AI outputs.)`;
      }
      
      return {
        plan: Array.from(selectedAgents).map(a => ({ agent: a, task: `Execute ${a} workflow` })),
        results
      };
    }

    function renderResults({ plan, results }) {
      const planHtml = `
        <div class="p-4 rounded-xl bg-blue-500/5 border border-blue-500/20 mb-6">
          <h4 class="text-blue-400 text-xs font-bold uppercase mb-2">Execution Plan</h4>
          <ul class="space-y-1">
            ${plan.map(step => `
              <li class="text-sm text-gray-300 flex gap-2">
                <span class="text-blue-500">→</span>
                <span class="font-mono text-xs uppercase text-gray-500 w-24">${step.agent}</span>
                <span>${step.task}</span>
              </li>
            `).join('')}
          </ul>
        </div>
      `;

      const artifactsHtml = Object.entries(results).map(([agentId, content]) => {
        const agent = AGENTS.find(a => a.id === agentId) || AGENTS[0];
        return `
          <div class="rounded-xl border border-white/5 bg-panel overflow-hidden mb-4">
            <div class="px-4 py-2 border-b border-white/5 flex items-center gap-2 bg-white/[0.02] ${agent.color}">
              <span>${agent.icon}</span>
              <span class="text-xs font-bold uppercase tracking-wide">${agent.label}</span>
            </div>
            <div class="p-5 prose prose-invert prose-sm max-w-none">
              <pre class="whitespace-pre-wrap font-sans text-gray-300 leading-relaxed">${content}</pre>
            </div>
          </div>
        `;
      }).join('');

      outputPanel.innerHTML = planHtml + artifactsHtml;
    }

    // Start
    init();
  </script>
</body>
</html>
